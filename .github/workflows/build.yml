name: Build Kite

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -D KITE_WERROR=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.config }}/kite.exe"
          @'
          fn fib(n) { if (n < 2) { return n } return fib(n - 1) + fib(n - 2) }
          let sum = 0
          for (let i = 0; i < 10; i += 1) { sum += fib(i) }
          print(sum)
          '@ | Set-Content smoke.kite
          & $exe build smoke.kite -o smoke.kbc
          $tree = & $exe run smoke.kite
          $vm = & $exe run --bytecode smoke.kite
          $artifact = & $exe exec smoke.kbc
          if ($tree -ne "88" -or $vm -ne "88" -or $artifact -ne "88") {
            throw "smoke test mismatch: tree=$tree vm=$vm artifact=$artifact"
          }
