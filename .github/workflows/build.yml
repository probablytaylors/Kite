name: Build Kite

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -D KITE_WERROR=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "build/${{ matrix.config }}/kite.exe"
          & $exe build examples/calculator.kite -o calculator.kbc
          $artifact = & $exe exec calculator.kbc
          $direct = & $exe run examples/calculator.kite
          if ($artifact -ne $direct) { throw "artifact output '$artifact' != interpreter output '$direct'" }
          foreach ($sample in Get-ChildItem examples/*.kite) { & $exe run $sample.FullName | Out-Null }
